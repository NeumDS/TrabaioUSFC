# ===================================================================
# AlugaUFSC - Configurações do Backend Spring Boot (Java 21)
# ===================================================================
spring.application.name=aluga-ufsc-backend
server.port=8080

# Configuração do Banco de Dados MySQL
# Certifique-se de que o banco 'aluga_ufsc' exista no seu MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/aluga_ufsc?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configurações do Jackson JSON
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd

# Logging
logging.level.com.alugaufsc=INFO
logging.level.org.springframework.web=INFO

